# Shared toolchain and checks for the shortpoet-cloud Terraform module repositories.
# The org checkout root links its mise.toml here (see README.md). Mise reads
# parent-directory config, so `mise run check` works from any module repository,
# and {{config_root}} is that org root.

[tools]
terraform = "1.16.1"
tflint = "0.64.0"
terraform-docs = "0.24.0"

[tasks.tflint-init]
description = "Install the tflint ruleset plugins (downloads from GitHub releases; reads GITHUB_TOKEN when set)"
dir = "{{cwd}}"
# The task script uses bash (pipefail); Linux runners default to dash.
shell = "bash -c"
run = '''
set -euo pipefail
ruleset="{{config_root}}/.github/.tflint.hcl"
if [ ! -f "${ruleset}" ]; then
  echo "tflint-init: no ruleset at ${ruleset}; check out shortpoet-cloud/.github beside this repository and link mise.toml (see its README)" >&2
  exit 1
fi
tflint --init --config="${ruleset}"
'''

[tasks.check]
description = "fmt, validate, tflint and terraform test for every Terraform directory in the current repository"
dir = "{{cwd}}"
depends = ["tflint-init"]
# The task script uses bash (pipefail, here-strings, compgen); Linux runners default to dash.
shell = "bash -c"
run = '''
set -euo pipefail
ruleset="{{config_root}}/.github/.tflint.hcl"
terraform fmt -check -recursive
module_dirs="$("{{config_root}}/.github/bin/terraform-dirs")"
while IFS= read -r module_dir; do
  echo "== ${module_dir}"
  terraform -chdir="${module_dir}" init -backend=false -input=false >/dev/null
  terraform -chdir="${module_dir}" validate
  tflint --chdir="${module_dir}" --config="${ruleset}"
  # terraform test reads *.tftest.hcl from the module directory and from tests/.
  if [ -d "${module_dir%/}/tests" ] || compgen -G "${module_dir%/}/*.tftest.hcl" >/dev/null; then
    terraform -chdir="${module_dir}" test
  else
    echo "no tests in ${module_dir}"
  fi
done <<< "${module_dirs}"
'''

[tasks.lock]
description = "Re-resolve providers within their constraints and lock them for macOS (arm64) and Linux (amd64) in every Terraform directory"
dir = "{{cwd}}"
# The task script uses bash (pipefail, here-strings); Linux runners default to dash.
shell = "bash -c"
run = '''
set -euo pipefail
module_dirs="$("{{config_root}}/.github/bin/terraform-dirs")"
while IFS= read -r module_dir; do
  echo "== ${module_dir}"
  terraform -chdir="${module_dir}" init -backend=false -upgrade -input=false >/dev/null
  terraform -chdir="${module_dir}" providers lock -platform=darwin_arm64 -platform=linux_amd64 >/dev/null
done <<< "${module_dirs}"
'''
